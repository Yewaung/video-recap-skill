[project]
name = "recap-pipeline"
version = "0.2.0"
description = "Clean-architecture Myanmar video recap dubbing and subtitling pipeline"
requires-python = ">=3.11"
dependencies = [
    "edge-tts>=7.0.0",
]

[project.scripts]
recap = "recap_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recap_pipeline"]
